name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_wasm_plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM Plugins
        run: |
          mkdir -p dist/plugins-wasm
          for plugin in plugins-wasm/*/; do
            if [ -f "${plugin}Cargo.toml" ]; then
              PLUGIN_NAME=$(basename "$plugin")
              echo "Building WASM plugin: $PLUGIN_NAME"
              cargo build --manifest-path "${plugin}Cargo.toml" --target wasm32-unknown-unknown --release
              WASM_FILE="target/wasm32-unknown-unknown/release/valayam_plugin_${PLUGIN_NAME//-/_}.wasm"
              if [ -f "$WASM_FILE" ]; then
                cp "$WASM_FILE" "dist/plugins-wasm/${PLUGIN_NAME}.wasm"
              fi
            fi
          done

      - name: Zip Plugins
        run: |
          cd dist && zip -r valayam-plugins.zip plugins-wasm/

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/valayam-plugins.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_binaries:
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-msvc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build binary
        run: cargo build --package valayam-cli --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/valayam${{ endsWith(matrix.target, 'windows-msvc') && '.exe' || '' }}" "dist/valayam-${{ matrix.target }}${{ endsWith(matrix.target, 'windows-msvc') && '.exe' || '' }}"

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker_push:
    runs-on: ubuntu-latest
    needs: [build_wasm_plugins, build_binaries]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max