name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Release for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: valayam
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: valayam
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: valayam.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }} -p valayam-cli

      - name: Archive Binary
        id: archive
        shell: bash
        run: |
          mkdir -p release-archive
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} release-archive/
          cd release-archive
          if [ "${{ runner.os }}" = "Windows" ]; then
            tar.exe -a -c -f valayam-${{ matrix.target }}.zip ${{ matrix.binary_name }}
            echo "archive_name=valayam-${{ matrix.target }}.zip" >> $GITHUB_OUTPUT
          else
            tar -czf valayam-${{ matrix.target }}.tar.gz ${{ matrix.binary_name }}
            echo "archive_name=valayam-${{ matrix.target }}.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: release-archive/${{ steps.archive.outputs.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}