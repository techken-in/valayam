[package]
license = "Apache-2.0"
name = "valayam-plugin-sdk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_yaml intentionally omitted — not used by SDK, would block WASM compilation

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lazy_static = "1.4"
