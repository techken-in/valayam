[package]
name = "valayam-ebpf-agent-ebpf"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
aya-ebpf = "0.1.0"
aya-log-ebpf = "0.1.0"
valayam-ebpf-agent-common = { path = "../valayam-ebpf-agent-common" }

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
