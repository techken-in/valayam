[package]
license = "Apache-2.0"
name = "valayam-cli"
version.workspace = true
edition.workspace = true

[dependencies]
tokio-util = { version = "0.7", features = ["rt"] }
tokio = { workspace = true }
clap = { workspace = true }
walkdir.workspace = true
valayam-core = { path = "../valayam-core" }
valayam-core-net = { path = "../valayam-core-net" }
valayam-engine = { workspace = true }
valayam-telemetry = { path = "../valayam-telemetry" }
valayam-crypto = { path = "../valayam-crypto" }
valayam-state = { path = "../valayam-state" }
valayam-reporter = { path = "../valayam-reporter" }
valayam-proxy = { path = "../valayam-proxy" }
valayam-oob = { path = "../valayam-oob" }
valayam-config = { path = "../valayam-config" }
valayam-models = { workspace = true }
valayam-network = { workspace = true }
valayam-common = { path = "../valayam-common" }
indicatif = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1.44"
tonic = { workspace = true }
prost = { workspace = true }
rcgen = "0.12"
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
dirs = "5.0"
time = "0.3"
reqwest = { workspace = true }
hyper = { version = "0.14", features = ["full"] }
