hex.workspace = true
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1.24.0", features = ["v4"] }
dotenvy = "0.15"
valayam-api = { version = "0.1.0", path = "../valayam-api" }
[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile.workspace = true
