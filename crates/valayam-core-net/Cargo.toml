[package]
license = "Apache-2.0"
name = "valayam-core-net"
version = "0.1.0"
edition = "2021"

[dependencies]
valayam-models = { path = "../valayam-models" }
valayam-network = { path = "../valayam-network", version = "0.1.0" }
valayam-engine = { path = "../valayam-engine", version = "0.1.0" }
valayam-oob = { path = "../valayam-oob" }
valayam-payloads = { path = "../valayam-payloads" }
valayam-common = { path = "../valayam-common" }
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
anyhow = "1.0"
hickory-resolver = "0.24"
x509-parser = "0.16"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
tracing = "0.1"
chrono.workspace = true
rand.workspace = true
parking_lot.workspace = true

[dev-dependencies]
serde_yaml.workspace = true
