id: client-secret-audit
info:
  name: "Client Secret Exposure Audit"
  severity: "High"
  description: "Audits client-side code and responses for exposed API keys, client secrets, and tokens."
  compliance:
    cwe: "CWE-798"
client_secret_audit:
  - target: "https://{{Hostname}}"
    matchers:
      - type: regex
        part: body
        regex:
          - "api[_-]?key"
          - "client[_-]?secret"
          - "access[_-]?token"
          - "bearer [a-zA-Z0-9_\\-\\.]{20,}"
  - target: "https://{{Hostname}}/static"
    matchers:
      - type: regex
        part: body
        regex:
          - "api[_-]?key"
          - "client[_-]?secret"
  - target: "https://{{Hostname}}/assets"
    matchers:
      - type: regex
        part: body
        regex:
          - "api[_-]?key"
          - "client[_-]?secret"