[package]
name = "cors-audit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CORS misconfiguration audit plugin for Valayam"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4.1"
valayam-plugin-sdk = { path = "../../crates/valayam-plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"