[package]
name = "recon-audit"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
valayam-plugin-sdk = { path = "../../crates/valayam-plugin-sdk" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
extism-pdk = "1.4.1"
uuid = { version = "1.8", features = ["v4"] }
md5 = "0.7.0"
urlencoding = "2.1.3"
